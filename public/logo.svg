<svg width="400" height="180" viewBox="0 0 400 180" xmlns="http://www.w3.org/2000/svg">
  <title>The Léth Clothing Shop Logo - Text Only (Large)</title>
  <desc>Text logo for The Léth Clothing Shop with larger font size.</desc>

  <style>
      .bg         { fill: #fff; }
      .text-main  { fill: #6B413F; font-family: 'Times New Roman', Times, serif; font-weight: 700; }
      .text-sub   { fill: #A39695; font-family: Arial, Helvetica, sans-serif; letter-spacing: 2px; }
  </style>

  <rect width="100%" height="100%" class="bg" />

  <g id="text-block" text-anchor="middle">
    <text x="50%" y="95" font-size="72px" class="text-main">THE LÉTH</text>
    
    <text x="50%" y="135" font-size="24px" class="text-sub">CLOTHING SHOP</text>
  </g>
</svg>